name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE: lukablaskovic/fp-fipu-internship-frontend
          TAG: ${{ github.ref_name == 'test' && 'test' || 'latest' }}
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --build-arg FRONTEND_CHANNEL="$TAG" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:sha-$GITHUB_SHA"
            docker push "$IMAGE:sha-$GITHUB_SHA"
          fi
