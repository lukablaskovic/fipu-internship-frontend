version: "3.4"

services:
  fipu-praksa-frontend:
    image: lukablaskovic/fp-fipu-internship-frontend
    container_name: fipu-praksa-frontend
    volumes:
      - fipu-praksa-frontend_build:/app/dist
    networks:
      - app-network
    expose:
      - "4000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8085:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/fipu-praksa.unipu.hr:/etc/letsencrypt/live/fipu-praksa.unipu.hr
      - /etc/letsencrypt/archive/fipu-praksa.unipu.hr:/etc/letsencrypt/archive/fipu-praksa.unipu.hr
      - /etc/letsencrypt/live/fipubot.unipu.hr:/etc/letsencrypt/live/fipubot.unipu.hr
      - /etc/letsencrypt/archive/fipubot.unipu.hr:/etc/letsencrypt/archive/fipubot.unipu.hr
      - /etc/letsencrypt/live/baserow.unipu.hr:/etc/letsencrypt/live/baserow.unipu.hr
      - /etc/letsencrypt/archive/baserow.unipu.hr:/etc/letsencrypt/archive/baserow.unipu.hr
    depends_on:
      - fipu-praksa-frontend
      - baserow-db
    networks:
      - app-network

  bpmn-studio:
    build: ../../../fipu-internship-bpmn-studio
    restart: unless-stopped
    volumes:
      - ./studio-models:/models
    networks:
      - app-network

  fipu-internship-bpmn-engine:
    volumes:
      - ./studio-models:/app/models:ro
    image: lukablaskovic/fp-fipu-internship-bpmn-engine
    env_file:
      - .env
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - POSTGRES_PROVIDER=${POSTGRES_PROVIDER}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB_NAME=${POSTGRES_DB1_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - BASEROW_CONNECTOR_URL=${BASEROW_CONNECTOR_URL}
      - EMAILJS_CONNECTOR_URL=${EMAILJS_CONNECTOR_URL}
      - PDF_CONNECTOR_URL=${PDF_CONNECTOR_URL}
      - WORKFLOW_SERVICE_TOKEN=${WORKFLOW_SERVICE_TOKEN:?set shared workflow credential}
      - PORT=${PBE_PORT}
    depends_on:
      - postgres-db
      - baserow-db
    expose:
      - "8080"
    networks:
      app-network:
        aliases:
          - python-bpmn-engine # Existing deployment environment URLs

  baserow-connector:
    image: lukablaskovic/fp-baserow-connector-service
    env_file:
      - .env
    environment:
      - BASEROW_TOKEN=${BASEROW_TOKEN}
      - BASE_URL=${BASEROW_BASE_URL}
      - WORKFLOW_SERVICE_TOKEN=${WORKFLOW_SERVICE_TOKEN:?set shared workflow credential}
      - COORDINATOR_EMAILS=${COORDINATOR_EMAILS:?set coordinator email allowlist}
      - ADMINISTRATORS_DB_PATH=/administrator-data/administrators.sqlite3
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOW_LOCAL_DEMO=false
      - PORT=${BCS_PORT}
      - DEBUG=1
    volumes:
      - ./volumes/administrators:/administrator-data

    depends_on:
      - postgres-db
      - baserow-db
    expose:
      - "8082"
    networks:
      - app-network

  emailjs-connector:
    image: lukablaskovic/fp-emailjs-connector-service
    env_file:
      - .env
    environment:
      - SERVICE_ID=${EMAILJS_SERVICE_ID}
      - TEMPLATE_ID=${EMAILJS_TEMPLATE_ID}
      - PUBLIC_KEY=${EMAILJS_PUBLIC_KEY}
      - PRIVATE_KEY=${EMAILJS_PRIVATE_KEY}
      - PORT=8083
    depends_on:
      - postgres-db
      - baserow-db
    expose:
      - "8083"
    networks:
      - app-network

  pdf-connector:
    image: lukablaskovic/fp-pdf-connector-service
    env_file:
      - .env
    environment:
      - PORT=${PCS_PORT}
      - SERVICE_URL=${PCS_SERVICE_URL}
    depends_on:
      - postgres-db
      - baserow-db
    expose:
      - "8084"
    networks:
      - app-network
      
  baserow-db:
    image: baserow/baserow:2.4.1
    env_file:
      - .env
    environment:
      - BASEROW_PUBLIC_URL=${BASEROW_PUBLIC_URL}
      - BASEROW_EXTRA_ALLOWED_HOSTS=${BASEROW_EXTRA_ALLOWED_HOSTS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    expose:
      - "80"
    volumes:
      - ./volumes/baserow:/baserow/data
    networks:
      - app-network

  postgres-db:
    image: postgres:18.6
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "5433"
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres18-live:/var/lib/postgresql
    command: -p 5432
    networks:
      - app-network

volumes:
  fipu-praksa-frontend_build:


networks:
  app-network:
