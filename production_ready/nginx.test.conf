server {
    listen 80;
    server_name fipu-praksa-test.unipu.hr;
    return 301 https://fipu-praksa-test.unipu.hr$request_uri;
}

server {
    listen 443 ssl;
    server_name fipu-praksa-test.unipu.hr;

    ssl_certificate /etc/letsencrypt/live/fipu-praksa-test.unipu.hr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fipu-praksa-test.unipu.hr/privkey.pem;

    location / {
        # Resolve the current container IP after each test rollout.
        resolver 127.0.0.11 valid=10s;
        set $test_frontend fipu-praksa-test-frontend:4000;
        proxy_pass http://$test_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
