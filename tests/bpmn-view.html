<!doctype html>
<html lang="hr">
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BPMN view</title></head>
<body><div id="app"></div><script type="module">
import { createApp } from 'vue';
import { createRouter, createMemoryHistory } from 'vue-router';
import StudentsInternshipView from '../src/views/admin/StudentsInternshipView.vue';
import '../src/css/main.css';
const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/studenti/:process_instance_id?', component: StudentsInternshipView }] });
await router.push(new URLSearchParams(location.search).has('direct') ? '/studenti/demo' : '/studenti' + location.search);
createApp(StudentsInternshipView).use(router).mount('#app');
</script></body>
</html>
