<!doctype html>
<html lang="hr">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Form fields</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module">
			import { createRouter, createMemoryHistory } from "vue-router";
			import { createPinia } from "pinia";
			import { createApp, h } from "vue";
			import "../src/css/main.css";
			const views = {
				companies: () => import("../src/components/Tables/TableNewCompanies.vue"),
				application: () => import("../src/components/Internship/Student_PrijavnicaForm.vue"),
				diary: () => import("../src/components/Internship/Student_DnevnikPrakseForm.vue"),
				dynamic: () => import("../src/components/Form/FormDynamic.vue"),
				examples: () => import("../src/views/common/FormsView.vue"),
				process: () => import("../src/views/common/SelectProcess.vue"),
				controls: () => import("./SharedFields.vue"),
			};
			const view = new URLSearchParams(location.search).get("view");
			const component = (await views[view]()).default;
			const props = view === "dynamic" ? { formFields: { approved: { type: "yes-no-boolean", label: "Odobrenje" }, comment: { type: "input", label: "Komentar" } } } : {};
			const router = createRouter({ history: createMemoryHistory(), routes: [{ path: "/", component }] });
			await router.push("/");
			createApp({ render: () => h(component, props) })
				.use(createPinia())
				.use(router)
				.mount("#app");
		</script>
	</body>
</html>
