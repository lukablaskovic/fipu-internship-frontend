<!doctype html>
<html lang="hr">
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profil</title></head>
<body><div id="app"></div><script type="module">
import { createApp } from 'vue';
import { createRouter, createMemoryHistory } from 'vue-router';
import Profile from '../src/views/common/ProfileView.vue';
import '../src/css/main.css';
const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/', component: Profile }] });
createApp(Profile).use(router).mount('#app');
</script></body>
</html>
