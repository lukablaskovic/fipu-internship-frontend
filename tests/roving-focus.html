<html><head><title>Roving focus</title></head><body><div id="app" hidden></div><div id="fixture"></div><script type="module">
import {createApp} from "vue";
import {createPinia} from "pinia";
import {useUiStore} from "../src/stores/ui_store.ts";
import {createRouter, createMemoryHistory} from "vue-router";
import Test from "./RovingFocus.vue";
const router = createRouter({history: createMemoryHistory(), routes: [{path: '/:pathMatch(.*)*', component: {template: '<div />'}}]});
const pinia = createPinia();
const app = createApp(Test).use(pinia);
const ui = useUiStore(pinia);
ui.setStyle("basic");
ui.responsiveLayoutControl();
window.addEventListener("resize", () => ui.responsiveLayoutControl());
app.use(router).mount("#fixture");
</script></body></html>
