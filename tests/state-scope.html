<!doctype html><html lang="hr"><head><title>State scope</title></head><body><div id="app"></div><script type="module">
import { createApp } from 'vue';
import { createRouter, createMemoryHistory } from 'vue-router';
import StateScope from './StateScope.vue';
import '../src/css/main.css';
const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/', component: StateScope }] });
await router.push('/');
createApp(StateScope).use(router).mount('#app');
</script></body></html>
